modules:
  macro:
    - key: localised-date-macro-for-confluence
      resource: main-nonrepeating
      render: native
      resolver:
        function: resolver
      adfExport:
        function: adf-export-nonrepeating
      title: Localized date macro
      description: Display times in each viewer’s time zone
      layout: inline
      config: true
    - key: repeating-localised-date-macro-for-confluence
      resource: main-repeating
      render: native
      resolver:
        function: resolver
      adfExport:
        function: adf-export-repeating
      title: Repeating localized date macro
      description: Display recurring times in viewers’ time zones
      layout: inline
      config: true
  function:
    - key: resolver
      handler: index.handler
    - key: adf-export-nonrepeating
      handler: index.handleNonRepeating
    - key: adf-export-repeating
      handler: index.handleRepeating
resources:
  - key: main-nonrepeating
    path: src/frontend/non-repeating.jsx
  - key: main-repeating
    path: src/frontend/repeating.jsx
permissions:
  scopes:
    - read:user:confluence
app:
  id: ari:cloud:ecosystem::app/a3a5055d-08d6-4444-ba0f-49ac27f2150a
  runtime:
    name: nodejs22.x
