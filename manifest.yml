modules:
  macro:
    - key: localised-date-macro-for-confluence
      resource: main-nonrepeating
      render: native
      resolver:
        function: resolver
      adfExport:
        function: adf-export-nonrepeating
      title:
        i18n: macro.nonrepeating.title
      description:
        i18n: macro.nonrepeating.description
      layout: inline
      config: true
    - key: repeating-localised-date-macro-for-confluence
      resource: main-repeating
      render: native
      resolver:
        function: resolver
      adfExport:
        function: adf-export-repeating
      title:
        i18n: macro.repeating.title
      description:
        i18n: macro.repeating.description
      layout: inline
      config: true
  function:
    - key: resolver
      handler: index.handler
    - key: adf-export-nonrepeating
      handler: index.handleNonRepeating
    - key: adf-export-repeating
      handler: index.handleRepeating
translations:
  resources:
    - key: zh-CN
      path: locales/zh-CN.json
    - key: zh-TW
      path: locales/zh-TW.json
    - key: cs-CZ
      path: locales/cs-CZ.json
    - key: da-DK
      path: locales/da-DK.json
    - key: nl-NL
      path: locales/nl-NL.json
    - key: en-US
      path: locales/en-US.json
    - key: en-GB
      path: locales/en-GB.json
    - key: et-EE
      path: locales/et-EE.json
    - key: fi-FI
      path: locales/fi-FI.json
    - key: fr-FR
      path: locales/fr-FR.json
    - key: de-DE
      path: locales/de-DE.json
    - key: hu-HU
      path: locales/hu-HU.json
    - key: is-IS
      path: locales/is-IS.json
    - key: it-IT
      path: locales/it-IT.json
    - key: ja-JP
      path: locales/ja-JP.json
    - key: ko-KR
      path: locales/ko-KR.json
    - key: no-NO
      path: locales/no-NO.json
    - key: pl-PL
      path: locales/pl-PL.json
    - key: pt-BR
      path: locales/pt-BR.json
    - key: pt-PT
