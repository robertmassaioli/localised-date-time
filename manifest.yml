modules:
  macro:
    - key: localised-date-macro-for-confluence
      resource: main-nonrepeating
      render: native
      resolver:
        function: resolver
      adfExport:
        function: adf-export-nonrepeating
      title:
        i18n: macro.nonrepeating.title
      description:
        i18n: macro.nonrepeating.description
      layout: inline
      config: true
    - key: repeating-localised-date-macro-for-confluence
      resource: main-repeating
      render: native
      resolver:
        function: resolver
      adfExport:
        function: adf-export-repeating
      title:
        i18n: macro.repeating.title
      description:
        i18n: macro.repeating.description
      layout: inline
      config: true
  function:
    - key: resolver
      handler: index.handler
    - key: adf-export-nonrepeating
      handler: index.handleNonRepeating
    - key: adf-export-repeating
      handler: index.handleRepeating
translations:
  resources:
    - key: en-US
      path: locales/en-US.json
    - key: en-GB
      path: locales/en-GB.json
  fallback:
    default: en-GB
resources:
  - key: main-nonrepeating
    path: src/frontend/non-repeating.jsx
  - key: main-repeating
    path: src/frontend/repeating.jsx
permissions:
  scopes:
    - read:user:confluence
app:
  id: ari:cloud:ecosystem::app/a3a5055d-08d6-4444-ba0f-49ac27f2150a
  runtime:
    name: nodejs22.x
