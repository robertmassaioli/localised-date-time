name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # package-lock.json records download URLs on Atlassian's internal Artifactory, which a
      # public runner cannot reach. Every package is also on the public registry with the same
      # tarball, so the integrity hashes still match after the URL prefix is rewritten.
      - name: Point the lockfile at the public npm registry
        run: sed -i -E 's#https://packages\.atlassian\.com/(artifactory/)?api/npm/[^/]+/#https://registry.npmjs.org/#g' package-lock.json

      - name: Install dependencies
        run: npm ci --registry=https://registry.npmjs.org

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test
